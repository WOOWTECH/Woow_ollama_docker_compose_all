---
# ClusterIP service for in-cluster consumers (e.g. Open WebUI, LangChain).
# Reachable as ollama.ollama.svc.cluster.local:11434
apiVersion: v1
kind: Service
metadata:
  name: ollama
  namespace: ollama
  labels:
    app: ollama
spec:
  type: ClusterIP
  selector:
    app: ollama
  ports:
    - name: http
      port: 11434
      targetPort: http
      protocol: TCP

---
# NodePort service for external / host-level access.
# Reachable as <any-node-ip>:31434
# Note: nodePort must be in the 30000-32767 range by default in k3s.
# We use 31434 (close to the Ollama default 11434) for easy recall.
apiVersion: v1
kind: Service
metadata:
  name: ollama-nodeport
  namespace: ollama
  labels:
    app: ollama
spec:
  type: NodePort
  selector:
    app: ollama
  ports:
    - name: http
      port: 11434
      targetPort: http
      nodePort: 31434
      protocol: TCP
