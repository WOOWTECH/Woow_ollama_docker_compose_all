version: "3.9"

services:
  emqx:
    image: emqx/emqx:latest
    container_name: emqx
    restart: unless-stopped
    ports:
      # MQTT TCP
      - "1883:1883"
      # MQTT SSL/TLS
      - "8883:8883"
      # MQTT WebSocket
      - "8083:8083"
      # MQTT WebSocket SSL
      - "8084:8084"
      # Dashboard
      - "18083:18083"
    volumes:
      - emqx_data:/opt/emqx/data
      - emqx_log:/opt/emqx/log
    environment:
      - EMQX_NAME=emqx
      - EMQX_HOST=127.0.0.1
    healthcheck:
      test: ["CMD", "emqx", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  emqx_data:
    name: emqx_data
  emqx_log:
    name: emqx_log
